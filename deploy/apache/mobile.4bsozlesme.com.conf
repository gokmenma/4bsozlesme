<VirtualHost *:80>
    ServerName mobile.4bsozlesme.com
    DocumentRoot "/opt/lampp/htdocs/sozlesme-4b/mobile-spa/dist"

    <Directory "/opt/lampp/htdocs/sozlesme-4b/mobile-spa/dist">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.html
    </Directory>

    ErrorLog "logs/mobile.4bsozlesme.com-error_log"
    CustomLog "logs/mobile.4bsozlesme.com-access_log" common
</VirtualHost>
